<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registreren - MijnICT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="grid-bg">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><div class="logo-icon">&lt;/&gt;</div>Mijn<span>ICT</span></a>
      <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')">&#9776;</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="login.html" class="btn btn-outline">Inloggen</a>
        <a href="register.html" class="btn btn-primary">Registreren</a>
      </nav>
    </div>
  </header>

  <!-- Registratie formulier -->
  <main class="form-page">
    <div class="form-box">
      <div class="window-bar"><i></i><i></i><i></i><span>register.sh</span></div>

      <h1>Account aanmaken</h1>
      <p class="subtitle">Vul je gegevens in om te beginnen.</p>

      <div id="message" class="message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Naam</label>
          <input type="text" id="name" placeholder="Je volledige naam" required>
        </div>

        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" placeholder="jij@voorbeeld.nl" required>
        </div>

        <div class="form-group">
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" placeholder="Minstens 6 tekens" required>
        </div>

        <div class="form-group">
          <label for="password2">Herhaal wachtwoord</label>
          <input type="password" id="password2" placeholder="Nog een keer" required>
        </div>

        <div class="form-row">
          <label class="checkbox">
            <input type="checkbox" id="terms"> Ik ga akkoord met de voorwaarden
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Registreren</button>
      </form>

      <p class="form-footer">
        Heb je al een account? <a href="login.html">Log hier in</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 MijnICT &middot; Alle rechten voorbehouden</p>
  </footer>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      const terms = document.getElementById("terms").checked;
      const message = document.getElementById("message");

      function showError(text) {
        message.className = "message error";
        message.textContent = "Fout: " + text;
      }

      if (password.length < 6) {
        return showError("je wachtwoord moet minstens 6 tekens zijn.");
      }
      if (password !== password2) {
        return showError("de wachtwoorden zijn niet hetzelfde.");
      }
      if (!terms) {
        return showError("je moet akkoord gaan met de voorwaarden.");
      }

      // Hier zou je normaal naar een server sturen om het account op te slaan
      message.className = "message success";
      message.textContent = "Welkom " + name + "! Je account is aangemaakt.";
      this.reset();
    });
  </script>

</body>
</html>
