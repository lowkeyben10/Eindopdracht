<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen - MijnICT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="grid-bg">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><div class="logo-icon">&lt;/&gt;</div>Mijn<span>ICT</span></a>
      <button class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('open')">&#9776;</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="login.html" class="btn btn-outline">Inloggen</a>
        <a href="register.html" class="btn btn-primary">Registreren</a>
      </nav>
    </div>
  </header>

  <!-- Login formulier -->
  <main class="form-page">
    <div class="form-box">
      <div class="window-bar"><i></i><i></i><i></i><span>login.sh</span></div>

      <h1>Inloggen</h1>
      <p class="subtitle">Welkom terug! Log in op je account.</p>

      <div id="message" class="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" placeholder="jij@voorbeeld.nl" required>
        </div>

        <div class="form-group">
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-row">
          <label class="checkbox">
            <input type="checkbox" id="remember"> Onthoud mij
          </label>
          <a href="#">Wachtwoord vergeten?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Inloggen</button>
      </form>

      <p class="form-footer">
        Nog geen account? <a href="register.html">Registreer hier</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 MijnICT &middot; Alle rechten voorbehouden</p>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (password.length < 6) {
        message.className = "message error";
        message.textContent = "Fout: je wachtwoord moet minstens 6 tekens zijn.";
        return;
      }

      // Hier zou je normaal naar een server sturen om in te loggen
      message.className = "message success";
      message.textContent = "Ingelogd als " + email;
    });
  </script>

</body>
</html>
