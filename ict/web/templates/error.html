{% extends "base.html" %}
{% block title %}Fout {{ code }}{% endblock %}
{% block content %}
<section class="hero">
  <div class="badge"><span class="status-dot error-dot"></span> fout {{ code }}</div>
  <h1>Er ging iets <span class="accent">mis</span></h1>
  <p class="hero-text">{{ message }}</p>
  <p class="hero-text small">Deze fout is opgeslagen in het logbestand.</p>
  <div class="hero-buttons">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Naar home</a>
    {% if session.user %}<a href="{{ url_for('test_page') }}" class="btn btn-outline">Testcentrum</a>{% endif %}
  </div>
</section>
{% endblock %}
