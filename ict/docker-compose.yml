# GridWatch 2030 - demonstratieomgeving
# Starten:  docker compose up -d --build
# Stoppen:  docker compose down

services:

  # Container 1: de webapplicatie + REST API (Python Flask)
  webapp:
    build: ./web
    container_name: webapp
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://gridwatch:gridwatch@database:5432/gridwatch
      SECRET_KEY: verander-deze-geheime-sleutel
      ADMIN_PASSWORD: GridWatch2030!
      TIMEZONE: Europe/Amsterdam
    volumes:
      - ./logs:/app/logs          # logbestanden komen in de map ./logs op je eigen pc
    depends_on:
      database:
        condition: service_healthy  # wacht tot de database klaar is

  # Container 2: de database (PostgreSQL)
  database:
    image: postgres:16
    container_name: database
    environment:
      POSTGRES_USER: gridwatch
      POSTGRES_PASSWORD: gridwatch
      POSTGRES_DB: gridwatch
    volumes:
      - dbdata:/var/lib/postgresql/data   # gegevens blijven bewaard na herstart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridwatch -d gridwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
